<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="0;url=https://calendar.app.google/efaHo3DoGDjpH7pBA">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="Description" content="60 min bookable appointments">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Chat with Shady Khalifa">
  <meta name="twitter:description" content="60 min bookable appointments">
  <meta property="og:title" content="Chat with Shady Khalifa">
  <meta property="og:description" content="60 min bookable appointments">
  <meta property="og:url" content="https://shadykhalifa.me/meet">
  <link rel="icon" type="image/x-icon" href="https://calendar.google.com/googlecalendar/images/favicons_2020q4/calendar_31_256.ico">
  <link rel="stylesheet" href="/static/css/style.css" />
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const theme = params.has("dark") ? "dark" : params.has("light") ? "light" : null;

      if (theme) {
        document.documentElement.dataset.theme = theme;
      }
    })();
  </script>
  <title>Chat with Shady Khalifa</title>
</head>
<body class="bg-canvas text-ink font-mono text-document leading-document antialiased">
  <main class="w-full max-w-document">
    <header class="leading-masthead uppercase" aria-label="Website masthead">
      <p class="m-0">
        SHADY KHALIFA <span class="cursor" aria-hidden="true"></span><br>
        MEETING REDIRECT<br>
        <time data-current-year></time>
      </p>
    </header>
    <section class="mt-masthead" aria-labelledby="meeting-heading">
      <h1 id="meeting-heading" class="document-heading marker-h1">Book a meeting</h1>
      <p>
        Redirecting to Google Calendar. If nothing happens,
        <a href="https://calendar.app.google/efaHo3DoGDjpH7pBA">[continue](https://calendar.app.google)</a>.
      </p>
    </section>
    <footer class="site-footer" aria-label="Theme controls">
      <p class="m-0">
        Theme:
        <a href="/meet/">[system]</a>
        <a href="/meet/?light">[light]</a>
        <a href="/meet/?dark">[dark]</a>
      </p>
    </footer>
  </main>
  <script>
    const currentYear = String(new Date().getFullYear());

    document.querySelectorAll("[data-current-year]").forEach((element) => {
      element.dateTime = currentYear;
      element.textContent = currentYear;
    });
  </script>
  <script>window.location.href = "https://calendar.app.google/efaHo3DoGDjpH7pBA";</script>
</body>
</html>
